name: Settlers
options:
  bundleIdPrefix: com.jakebeinart.settlers
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
packages:
  CatanEngine:
    path: Packages/CatanEngine
  CatanAI:
    path: Packages/CatanAI
targets:
  Settlers:
    type: application
    platform: iOS
    sources:
      - path: Settlers
        excludes:
          - Signing.local.xcconfig
    settings:
      base:
        SWIFT_VERSION: "6.0"
        # A warning nobody has to act on is a warning everybody stops reading.
        # This is not hypothetical here: the two warnings standing when this was
        # turned on were a single real bug - a `where` clause in GameView's QA
        # fast-forward bound to only the last pattern, so `.setupForward`
        # matched every seat and drove a human move on a bot's setup turn. The
        # error it produced was swallowed by a `try?`, so nothing ever surfaced
        # it. Swift 6 language mode already implies complete concurrency
        # checking, so this is the remaining lever.
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        # The version numbers live HERE, not in project.pbxproj and not as
        # literals in Info.plist. `xcodegen generate` rewrites the pbxproj from
        # this file, so a build-number bump made there is silently discarded -
        # and a reused build number is rejected as ITMS-90189 only AFTER
        # archive, export and upload have all reported success.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "6"
        # Both of these come from Settlers/Signing.xcconfig, which carries
        # Jake's team and bundle id as the defaults and optionally includes a
        # gitignored Signing.local.xcconfig for anyone who has to sign with a
        # different team. Read that file before changing either of these.
        PRODUCT_BUNDLE_IDENTIFIER: $(SETTLERS_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        DEVELOPMENT_TEAM: $(SETTLERS_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
    configFiles:
      Debug: Settlers/Signing.xcconfig
      Release: Settlers/Signing.xcconfig
    dependencies:
      - package: CatanEngine
      - package: CatanAI
    info:
      path: Settlers/Info.plist
      properties:
        CFBundleDisplayName: Empires
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Without this the upload succeeds, the build processes, and then sits
        # invisible behind MISSING_EXPORT_COMPLIANCE reaching no tester at all.
        # The game does no cryptography beyond what the OS provides.
        ITSAppUsesNonExemptEncryption: false
        # Makes Documents/ (and therefore GameLogs/) visible in the Files
        # app and over USB, which is the only export route that keeps working
        # on a TestFlight build.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  # The app target had NO tests at all - 6,700 lines, 0% covered, and all
  # three bugs known to have shipped lived in it. `swift test` only reaches
  # the two SPM packages; nothing could ever reach `GameViewModel` or the
  # persistence stores.
  SettlersTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SettlersTests]
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Settlers
  SettlersUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SettlersUITests]
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Settlers
    dependencies:
      - target: Settlers

schemes:
  Settlers:
    build:
      targets:
        Settlers: all
        SettlersTests: [test]
        SettlersUITests: [test]
    test:
      # Was `targets: []`, which made `xcodebuild test -scheme Settlers`
      # report "Scheme is not currently configured for the test action" -
      # so any gate built on it would have been a false green.
      #
      # `parallelizable` is what lets `xcodebuild` distribute test CLASSES
      # across cloned simulators. Measured on this suite: the app-test stage
      # is ~1150s serial, of which ~750s is 50 UI tests - and almost none of
      # that is assertions. Each UI test cold-launches the app, because
      # `-ui-testing-reset` wipes the container and nothing is reused between
      # tests, so most of every test's ~15s is process spawn plus the first
      # SwiftUI render.
      #
      # This is safe here precisely BECAUSE of that isolation: no UI test
      # depends on state another one left behind, and each worker gets its
      # own simulator clone rather than sharing the `Empires QA` device. The
      # one test that deliberately relies on state surviving - the cold-resume
      # test - creates it and reads it back inside a single test method, so it
      # travels to whichever worker runs it.
      #
      # The worker COUNT is not set here. It belongs to the machine, not the
      # project, and `scripts/gate.sh` sets it (see `gate_app_tests`).
      targets:
        - name: SettlersTests
          parallelizable: true
        - name: SettlersUITests
          parallelizable: true
      gatherCoverageData: true
      coverageTargets:
        - Settlers
    run:
      config: Debug
